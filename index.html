<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>welcome to reet.org</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background-color: #0b0b12;
        background-image: url("https://files.catbox.moe/3c1025.gif");
        background-repeat: repeat;
        background-attachment: fixed;
        color: #d1d1d6;
        font-family: Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .splash-card {
        background: #25242c;
        border: 6px solid #484650;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        padding: 28px 24px;
        text-align: center;
        max-width: 380px;
        width: 100%;
      }

      .splash-card h1 {
        margin: 0 0 10px;
        font-size: 2rem;
        color: #f5f3f8;
        font-family: 'Bree Serif', serif, Arial;
        letter-spacing: 0.04em;
      }

      .splash-tagline {
        margin: 0 0 20px;
        font-size: 0.85rem;
        color: #aaa8b5;
      }

      .splash-graphic {
        display: block;
        margin: 0 auto 24px;
        max-height: 120px;
        width: auto;
        border-radius: 8px;
        image-rendering: pixelated;
      }

      .enter-btn {
        display: inline-block;
        padding: 12px 30px;
        background-color: #696772;
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        font-size: 1rem;
        border-radius: 8px;
        border: 2px solid #85838f;
        transition: transform 0.15s ease, background-color 0.15s ease;
      }

      .enter-btn:hover {
        background-color: #ff9cad;
        color: #292832;
        border-color: #ff9cad;
        transform: translateY(-2px);
      }

      .splash-warning {
        margin-top: 18px;
        margin-bottom: 0;
        font-size: 0.72rem;
        color: #85838f;
      }
    </style>
  </head>
  <body>

    <main class="splash-card">
      <h1>reet.org</h1>
      <p class="splash-tagline">a personal corner on the web ✦</p>

      <img src="pfp.jpg" alt="reet graphic" class="splash-graphic">

      <a href="home.html" class="enter-btn">[ enter site ]</a>

      <p class="splash-warning">best viewed on desktop / best with sound</p>
    </main>

  </body>
</html>
